
services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: geoai_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: geoai
      POSTGRES_PASSWORD: geoai_dev_pw
      POSTGRES_DB: geoai_db
    ports:
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

volumes:
  postgis_data: